services:
  - type: web
    name: bhoomi-sakha-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_DATABASE
        value: bhoomi_sakha
      - key: STORAGE_PROVIDER
        value: s3
      - key: AWS_REGION
        value: ap-south-1
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OFFICER_REGISTRATION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "1"
